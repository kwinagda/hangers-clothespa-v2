AWSTemplateFormatVersion: '2010-09-09'
Description: Empty, isolated Secrets Manager slots for Razorpay Live credentials. Does not grant runtime access or activate Live payments.

Resources:
  RazorpayLiveApiCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: hangers/production/razorpay/live-api
      Description: Razorpay Live API key ID and secret. JSON value staged separately; not readable by app roles until separately authorized.
      Tags:
        - Key: Application
          Value: Hangers CRM
        - Key: Environment
          Value: production
        - Key: Integration
          Value: razorpay-live
        - Key: RuntimeAccess
          Value: not-granted

  RazorpayLiveWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: hangers/production/razorpay/live-webhook
      Description: Separately generated Razorpay Live webhook signing secret. Not readable by app roles until separately authorized.
      Tags:
        - Key: Application
          Value: Hangers CRM
        - Key: Environment
          Value: production
        - Key: Integration
          Value: razorpay-live
        - Key: RuntimeAccess
          Value: not-granted

Outputs:
  RazorpayLiveApiCredentialsArn:
    Description: Secret ARN for the Razorpay Live API key pair.
    Value: !Ref RazorpayLiveApiCredentials
  RazorpayLiveWebhookSecretArn:
    Description: Secret ARN for the separately generated Live webhook signing secret.
    Value: !Ref RazorpayLiveWebhookSecret
