AWSTemplateFormatVersion: '2010-09-09'
Description: Separate retained Secrets Manager resources for Razorpay Live credentials, with read access limited to the production EC2 instance role.

Resources:
  RazorpayLiveApiCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: hangers/production/razorpay/live-api
      Description: Razorpay Live API key ID and secret as JSON; read is limited to the production EC2 instance role.
      Tags:
        - Key: Application
          Value: Hangers CRM
        - Key: Environment
          Value: production
        - Key: Integration
          Value: razorpay-live
        - Key: RuntimeAccess
          Value: scoped-production-instance-role

  RazorpayLiveWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: hangers/production/razorpay/live-webhook
      Description: Separately generated Razorpay Live webhook signing secret; read is limited to the production EC2 instance role.
      Tags:
        - Key: Application
          Value: Hangers CRM
        - Key: Environment
          Value: production
        - Key: Integration
          Value: razorpay-live
        - Key: RuntimeAccess
          Value: scoped-production-instance-role

  RazorpayLiveRuntimeSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: HangersRazorpayLiveSecretRead
      Roles:
        - HangersCRMProdSSMRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyTheTwoRazorpayLiveSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref RazorpayLiveApiCredentials
              - !Ref RazorpayLiveWebhookSecret

Outputs:
  RazorpayLiveApiCredentialsArn:
    Description: Secret ARN for the Razorpay Live API key pair.
    Value: !Ref RazorpayLiveApiCredentials
  RazorpayLiveWebhookSecretArn:
    Description: Secret ARN for the separately generated Live webhook signing secret.
    Value: !Ref RazorpayLiveWebhookSecret
