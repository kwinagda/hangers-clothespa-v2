name: Deploy Production CRM

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full Git commit SHA to deploy (defaults to the selected branch SHA)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-crm-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy code to EC2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deployment commit
        id: revision
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DEFAULT_COMMIT: ${{ github.sha }}
        run: |
          commit="${REQUESTED_COMMIT:-$DEFAULT_COMMIT}"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character Git commit SHA is required." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start SSM deployment
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.AWS_PRODUCTION_INSTANCE_ID }}
          COMMIT: ${{ steps.revision.outputs.commit }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Hangers CRM $COMMIT" \
            --timeout-seconds 1800 \
            --parameters "commands=sudo /usr/local/sbin/hangers-deploy-code '$COMMIT'" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ vars.AWS_PRODUCTION_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
