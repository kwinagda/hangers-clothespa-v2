name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangers-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangers
          POSTGRES_PASSWORD: hangers
          POSTGRES_DB: hangers_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://hangers:hangers@localhost:5432/hangers_test
      SHADOW_DATABASE_URL: postgresql://hangers:hangers@localhost:5432/hangers_shadow
      ADMIN_DATABASE_URL: postgresql://hangers:hangers@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hangers-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create migration shadow database
        run: |
          psql "$ADMIN_DATABASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname = 'hangers_shadow'" | grep -q 1 || \
            psql "$ADMIN_DATABASE_URL" -c "CREATE DATABASE hangers_shadow"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migrations match Prisma schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Rehearse migrations from an empty database
        run: npm run db:verify:fresh

      - name: Deploy migrations to test DB
        run: npx prisma migrate deploy

      - name: Run scoped Razorpay Payment Gateway and deployment contracts
        run: npm run test:razorpay-release

      - name: Verify Custom Checkout method and IIN contracts
        run: node --test tests/razorpay-custom-capabilities.unit.test.js tests/razorpay-saved-cards.unit.test.js tests/razorpay-downtime.unit.test.js

      - name: Verify combined invoice checkout against disposable database
        run: RUN_COMBINED_CHECKOUT_INTEGRATION=1 node --test tests/combined-checkout.integration.test.js

  crm:
    name: CRM — type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangers-crm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hangers-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1

      - name: Install browser for combined-checkout UI checks
        run: npx playwright install --with-deps chromium

      - name: Verify combined-checkout responsive UI
        run: npx playwright test --config=playwright.combined-ci.config.ts
