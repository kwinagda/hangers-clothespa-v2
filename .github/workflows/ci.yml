name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangers-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangers
          POSTGRES_PASSWORD: hangers
          POSTGRES_DB: hangers_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://hangers:hangers@localhost:5432/hangers_test
      SHADOW_DATABASE_URL: postgresql://hangers:hangers@localhost:5432/hangers_shadow
      ADMIN_DATABASE_URL: postgresql://hangers:hangers@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hangers-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create migration shadow database
        run: |
          psql "$ADMIN_DATABASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname = 'hangers_shadow'" | grep -q 1 || \
            psql "$ADMIN_DATABASE_URL" -c "CREATE DATABASE hangers_shadow"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migrations match Prisma schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Rehearse migrations from an empty database
        run: npm run db:verify:fresh

      - name: Deploy migrations to test DB
        run: npx prisma migrate deploy

      - name: Run scoped Razorpay Payment Gateway and deployment contracts
        run: npm run test:razorpay-release

      - name: Verify Custom Checkout and payment-state contracts
        run: node --test tests/razorpay-custom-capabilities.unit.test.js tests/razorpay-saved-cards.unit.test.js tests/razorpay-downtime.unit.test.js tests/razorpay-refund-binding.unit.test.js tests/razorpay-dispute.unit.test.js tests/razorpay-webhook-dispatch.unit.test.js tests/razorpay-bank-transfer.unit.test.js tests/razorpay-webhook-state-concurrency.unit.test.js

      - name: Verify Home-only Test notification dispatch
        run: node --test tests/local-outbox-scope.test.js tests/dev-outbox.test.js tests/outbox-retry.test.js tests/whatomate-dev-gate.test.js

      - name: Verify bounded Custom Checkout acceptance regressions
        run: node --test tests/checkout-callback-recovery-acceptance.unit.test.js tests/checkout-concurrency-acceptance.unit.test.js tests/checkout-downtime-acceptance.unit.test.js tests/checkout-refund-acceptance.unit.test.js

      - name: Verify payment diagnostic privacy
        run: node --test tests/redact.util.test.js tests/activity-provider-error-redaction.test.js

      - name: Verify guarded Custom schema release policy
        run: node --test tests/deploy-custom-checkout-migrations.test.js

      - name: Verify combined invoice checkout against disposable database
        run: RUN_COMBINED_CHECKOUT_INTEGRATION=1 node --test tests/combined-checkout.integration.test.js

      - name: Verify invoice allocation ownership boundaries
        run: node --test tests/receivables-workflow.test.js

      - name: Verify signed inbox and worker recovery with India timezone
        run: |
          psql "$DATABASE_URL" -c "ALTER ROLE hangers SET timezone TO 'Asia/Kolkata'"
          RUN_LOCAL_WEBHOOK_INTEGRATION=1 RAZORPAY_KEY_ID=rzp_test_webhook_ci node --test tests/razorpay-webhook-local.integration.test.js

  crm:
    name: CRM — type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangers-crm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hangers-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify invoice checkout state rendering
        run: node --experimental-strip-types --test tests/invoice-checkout/checkout-page.unit.mjs

      - name: Verify documented EMI response handling
        run: node --experimental-strip-types --test tests/invoice-checkout/checkout-emi-plans.unit.mjs

      - name: Verify guarded UPI app discovery
        run: node --experimental-strip-types --test tests/invoice-checkout/checkout-upi-discovery.unit.mjs

      - name: Verify SDK diagnostic privacy
        run: node --experimental-strip-types --test tests/invoice-checkout/payment-diagnostic-privacy.unit.mjs

      - name: Verify staging API proxy privacy headers
        run: node --test tests/staging-api-proxy.test.js

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1

      - name: Install browser for combined-checkout UI checks
        run: npx playwright install --with-deps chromium

      - name: Verify combined-checkout responsive UI
        run: npx playwright test --config=playwright.combined-ci.config.ts
